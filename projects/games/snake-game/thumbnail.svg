<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient background glow -->
  <circle cx="350" cy="337" r="280" fill="#10b981" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="850" cy="337" r="240" fill="#f43f5e" opacity="0.08" filter="url(#softGlow)" />

  <!-- Outer frame border -->
  <rect x="30" y="30" width="1140" height="615" rx="20" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2" />

  <!-- Decorative Corner Accents -->
  <path d="M 30 90 L 30 50 A 20 20 0 0 1 50 30 L 90 30" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <path d="M 1170 585 L 1170 625 A 20 20 0 0 1 1150 645 L 1110 645" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Food / Apple with glow -->
  <g transform="translate(860, 305)" filter="url(#neonGlow)">
    <circle cx="32" cy="32" r="26" fill="url(#foodGrad)" />
    <!-- Leaf -->
    <path d="M 32 6 Q 42 2 40 16 Q 32 14 32 6 Z" fill="#22c55e" />
  </g>

  <!-- Snake Body Segments (Winding path) -->
  <g filter="url(#neonGlow)">
    <!-- Tail to Body Segments -->
    <rect x="240" y="440" width="48" height="48" rx="10" fill="#065f46" opacity="0.8" />
    <rect x="296" y="440" width="48" height="48" rx="10" fill="#047857" opacity="0.85" />
    <rect x="352" y="440" width="48" height="48" rx="10" fill="#059669" opacity="0.9" />
    <rect x="408" y="440" width="48" height="48" rx="10" fill="#10b981" />
    <rect x="408" y="384" width="48" height="48" rx="10" fill="#10b981" />
    <rect x="408" y="328" width="48" height="48" rx="10" fill="#10b981" />
    <rect x="464" y="328" width="48" height="48" rx="10" fill="#34d399" />
    <rect x="520" y="328" width="48" height="48" rx="10" fill="#34d399" />
    <rect x="576" y="328" width="48" height="48" rx="10" fill="#34d399" />
    <rect x="632" y="328" width="48" height="48" rx="10" fill="#6ee7b7" />
    <rect x="688" y="328" width="48" height="48" rx="10" fill="#6ee7b7" />

    <!-- Snake Head -->
    <g transform="translate(744, 324)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#a7f3d0" />
      <!-- Eyes -->
      <circle cx="40" cy="16" r="6" fill="#064e3b" />
      <circle cx="42" cy="14" r="2" fill="#ffffff" />
      <circle cx="40" cy="40" r="6" fill="#064e3b" />
      <circle cx="42" cy="38" r="2" fill="#ffffff" />
      <!-- Tongue -->
      <path d="M 56 28 L 70 28 M 70 28 L 76 22 M 70 28 L 76 34" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Typography / Title -->
  <text x="600" y="160" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4">
    SNAKE GAME
  </text>
  <text x="600" y="210" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#34d399" letter-spacing="8">
    CLASSIC RETRO ARCADE
  </text>
</svg>
